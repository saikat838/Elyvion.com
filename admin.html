<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Elyvion — Admin Panel</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f2ff;
  color:#211437;
  padding-bottom:40px;
}

header{
  background:linear-gradient(135deg,#5b21b6,#8b5cf6);
  color:#fff;
  padding:20px;
}

header h1{
  font-size:24px;
}

header p{
  margin-top:6px;
  opacity:.85;
  font-size:13px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 5px 20px rgba(91,33,182,.08);
}

.login{
  max-width:420px;
  margin:70px auto;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0 12px;
}

label{
  font-size:13px;
  font-weight:bold;
  color:#555;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#6d28d9;
  color:#fff;
}

.approve{
  background:#16a34a;
  color:#fff;
}

.reject{
  background:#dc2626;
  color:#fff;
}

.closeBtn{
  background:#f59e0b;
  color:#fff;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.gray{
  background:#eee;
  color:#444;
}

.hidden{
  display:none!important;
}

.error{
  color:#b91c1c;
  background:#fee2e2;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:13px;
}

.success{
  color:#166534;
  background:#dcfce7;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(91,33,182,.08);
}

.stat small{
  color:#777;
}

.stat b{
  display:block;
  color:#5b21b6;
  font-size:25px;
  margin-top:8px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
  margin:25px 0 12px;
}

.request{
  border:1px solid #eadfff;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.row:last-child{
  border-bottom:0;
}

.row b{
  color:#5b21b6;
  text-align:right;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  background:#fff7ed;
  color:#b45309;
}

.status.approved{
  background:#dcfce7;
  color:#15803d;
}

.status.rejected{
  background:#fee2e2;
  color:#b91c1c;
}

.status.completed{
  background:#dcfce7;
  color:#15803d;
}

.status.closed{
  background:#e5e7eb;
  color:#374151;
}

.status.pending{
  background:#fff7ed;
  color:#b45309;
}

.screenshot{
  width:180px;
  max-height:180px;
  object-fit:contain;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:12px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

.flex{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.refresh{
  margin-bottom:10px;
}

.action{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.loading{
  opacity:.6;
  pointer-events:none;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr;
  }

  .row{
    flex-direction:column;
  }

  .row b{
    text-align:left;
  }

  button{
    width:100%;
  }

}

</style>
</head>

<body>

===================================================== -->

<!-- =====================================================

===================================================== -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyDW2cneWncBkDz_iVeUtKpjgl-NRxh0qQA",

  authDomain:
  "elyvioncom.firebaseapp.com",

  projectId:
  "elyvioncom",

  storageBucket:
  "elyvioncom.firebasestorage.app",

  messagingSenderId:
  "696113174945",

  appId:
  "1:696113174945:web:7dd53b1d9e47d6d05613e0",

  measurementId:
  "G-059RB98EPD"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================================
   ADMIN
===================================================== */

const ADMIN_EMAIL =
  "saikatmd7373@gmail.com";


/* =====================================================
   GLOBAL FUNCTIONS
===================================================== */

window.adminLogin = adminLogin;
window.adminLogout = adminLogout;
window.loadAll = loadAll;

window.updateRequestStatus =
  updateRequestStatus;

window.updateTicketStatus =
  updateTicketStatus;


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(auth,user=>{

  if(!user){

    document
      .getElementById("loginPage")
      .classList.remove("hidden");

    document
      .getElementById("dashboard")
      .classList.add("hidden");

    return;
  }


  if(user.email !== ADMIN_EMAIL){

    alert("এই account-এর Admin access নেই।");

    signOut(auth);

    return;
  }


  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  document
    .getElementById("adminEmailText")
    .innerText =
    user.email || "";

  loadAll();

});


/* =====================================================
   LOGIN
===================================================== */

async function adminLogin(){

  const email =
    document
      .getElementById("adminEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;

  const error =
    document
      .getElementById("loginError");


  error.className = "";
  error.innerText = "";


  if(!email || !password){

    error.className = "error";

    error.innerText =
      "Email এবং password দিন।";

    return;
  }


  if(email !== ADMIN_EMAIL){

    error.className = "error";

    error.innerText =
      "এই email Admin account নয়।";

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }
  catch(e){

    console.error(e);

    error.className = "error";

    error.innerText =
      "Login failed: " + e.code;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function adminLogout(){

  await signOut(auth);

}


/* =====================================================
   LOAD ALL
===================================================== */

function loadAll(){

  loadUsers();
  loadDeposits();
  loadPlans();
  loadWithdrawals();
  loadTasks();
  loadTickets();

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateRequestStatus(
  collectionName,
  requestId,
  newStatus
){

  if(!auth.currentUser){

    alert("Admin login করুন।");

    return;
  }


  if(auth.currentUser.email !== ADMIN_EMAIL){

    alert("Admin access required.");

    return;
  }


  const message =
    newStatus === "Approved"
      ? "এই request Approve করতে চান?"
      : "এই request Reject করতে চান?";


  if(!confirm(message)){

    return;
  }


  try{

    const requestRef =
      doc(
        db,
        collectionName,
        requestId
      );


    await updateDoc(
      requestRef,
      {
        status:newStatus,
        reviewedBy:ADMIN_EMAIL,
        reviewedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      }
    );


    alert(
      "Request " +
      newStatus +
      " করা হয়েছে।"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Status update হয়নি: " +
      error.message
    );

  }

}


/* =====================================================
   TICKET STATUS
===================================================== */

async function updateTicketStatus(
  ticketId,
  newStatus
){

  if(!auth.currentUser ||
     auth.currentUser.email !== ADMIN_EMAIL){

    alert("Admin access required.");

    return;
  }


  try{

    await updateDoc(
      doc(
        db,
        "supportTickets",
        ticketId
      ),
      {
        status:newStatus,
        updatedAt:serverTimestamp()
      }
    );


    alert(
      "Ticket " +
      newStatus +
      " করা হয়েছে।"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Ticket update হয়নি: " +
      error.message
    );

  }

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(status){

  const s =
    String(status || "Pending")
      .toLowerCase();


  if(s === "approved")
    return "approved";

  if(s === "rejected")
    return "rejected";

  if(s === "completed")
    return "completed";

  if(s === "closed")
    return "closed";

  return "pending";

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

function actionButtons(
  collectionName,
  id,
  status
){

  const s =
    String(status || "Pending")
      .toLowerCase();


  if(
    s === "approved" ||
    s === "rejected" ||
    s === "completed"
  ){

    return `
      <div class="action">
        <span class="status ${statusClass(status)}">
          ${escapeHTML(status)}
        </span>
      </div>
    `;

  }


  return `

    <div class="action">

      <div class="flex">

        <button
          class="approve"
          onclick="updateRequestStatus(
            '${collectionName}',
            '${id}',
            'Approved'
          )"
        >
          ✅ Approve
        </button>

        <button
          class="reject"
          onclick="updateRequestStatus(
            '${collectionName}',
            '${id}',
            'Rejected'
          )"
        >
          ❌ Reject
        </button>

      </div>

    </div>

  `;

}


/* =====================================================
   USERS
===================================================== */

function loadUsers(){

  const q =
    query(
      collection(db,"users")
    );


  onSnapshot(q,snap=>{

    document
      .getElementById("totalUsers")
      .innerText =
      snap.size;

  },error=>{

    console.error("Users:",error);

  });

}


/* =====================================================
   DEPOSITS
===================================================== */

function loadDeposits(){

  const q =
    query(
      collection(db,"depositRequests"),
      orderBy("createdAt","desc")
    );


  onSnapshot(q,snap=>{

    document
      .getElementById("totalDeposits")
      .innerText =
      snap.size;


    const box =
      document
        .getElementById("depositList");


    if(snap.empty){

      box.innerHTML =
        '<div class="empty">কোনো Deposit Request নেই</div>';

      return;
    }


    box.innerHTML =
      snap.docs.map(d=>{

        const x =
          d.data();

        const status =
          x.status || "Pending";


        return `

        <div class="request">

          <div class="row">
            <span>User</span>
            <b>
              ${escapeHTML(x.email || x.uid || "")}
            </b>
          </div>

          <div class="row">
            <span>Amount</span>
            <b>
              ৳${Number(x.amount || 0).toLocaleString()}
            </b>
          </div>

          <div class="row">
            <span>Method</span>
            <b>
              ${escapeHTML(x.method || "")}
            </b>
          </div>

          <div class="row">
            <span>Sender Last 4</span>
            <b>
              ${escapeHTML(x.senderLast4 || "")}
            </b>
          </div>

          <div class="row">
            <span>Status</span>

            <span class="status ${statusClass(status)}">
              ${escapeHTML(status)}
            </span>
          </div>

          ${
            x.screenshotURL
            ?
            `
            <img
              class="screenshot"
              src="${escapeHTML(x.screenshotURL)}"
              onclick="window.open('${escapeHTML(x.screenshotURL)}','_blank')"
              alt="Screenshot"
            >
            `
            :
            ""
          }

          ${
            actionButtons(
              "depositRequests",
              d.id,
              status
            )
          }

        </div>

        `;

      }).join("");

  },error=>{

    console.error(error);

    document
      .getElementById("depositList")
      .innerHTML =
      '<div class="empty">Deposit data load করা যায়নি।</div>';

  });

}

            <b>
              ${escapeHTML(x.email || x.uid || "")}
            </b>
          </div>

          <div class="row">
            <span>Subject</span>
            <b>
              ${escapeHTML(x.subject || "")}
            </b>
          </div>

          <div style="padding:10px 0">
            ${escapeHTML(x.message || "")}
          </div>

          <div class="row">
            <span>Status</span>

            <span class="status ${statusClass(status)}">
              ${escapeHTML(status)}
            </span>
          </div>

          <div class="action">

            <button
              class="closeBtn"
              onclick="updateTicketStatus(
                '${d.id}',
                '${String(status).toLowerCase()==='closed'
                  ? 'Open'
                  : 'Closed'}'
              )"
            >
              ${
                String(status).toLowerCase()==='closed'
                ? '🔓 Re-open'
                : '🔒 Close Ticket'
              }
            </button>

          </div>

        </div>

        `;

      }).join("");

  },error=>{

    console.error(
      "Tickets:",
      error
    );

  });

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>
