<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Elyvion — Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f6f2ff;
  color:#211437;
  padding-bottom:40px;
}

header{
  background:linear-gradient(135deg,#5b21b6,#8b5cf6);
  color:#fff;
  padding:20px;
}

header h1{
  font-size:24px;
}

header p{
  margin-top:6px;
  opacity:.85;
  font-size:13px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 5px 20px rgba(91,33,182,.08);
}

.login{
  max-width:420px;
  margin:70px auto;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0 12px;
}

label{
  font-size:13px;
  font-weight:bold;
  color:#555;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#6d28d9;
  color:#fff;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.gray{
  background:#eee;
  color:#444;
}

.hidden{
  display:none!important;
}

.error{
  color:#b91c1c;
  background:#fee2e2;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:13px;
}

.success{
  color:#166534;
  background:#dcfce7;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(91,33,182,.08);
}

.stat small{
  color:#777;
}

.stat b{
  display:block;
  color:#5b21b6;
  font-size:25px;
  margin-top:8px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
  margin:25px 0 12px;
}

.request{
  border:1px solid #eadfff;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.row:last-child{
  border-bottom:0;
}

.row b{
  color:#5b21b6;
  text-align:right;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  background:#fff7ed;
  color:#b45309;
}

.status.approved{
  background:#dcfce7;
  color:#15803d;
}

.status.rejected{
  background:#fee2e2;
  color:#b91c1c;
}

.screenshot{
  width:180px;
  max-height:180px;
  object-fit:contain;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:12px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

.flex{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.refresh{
  margin-bottom:10px;
}

.user-card{
  border:1px solid #eadfff;
  padding:15px;
  border-radius:14px;
  margin:10px 0;
}

.user-name{
  font-size:17px;
  font-weight:bold;
  color:#5b21b6;
  margin-bottom:8px;
}

.search{
  margin-bottom:12px;
}

.badge{
  display:inline-block;
  background:#ede9fe;
  color:#5b21b6;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr;
  }

  .row{
    flex-direction:column;
  }

  .row b{
    text-align:left;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

  <div class="card login">

    <h2 style="text-align:center;color:#5b21b6">
      💜 Elyvion Admin

    <p style="text-align:center;color:#777;margin:8px 0 20px">

    </p>

    <label>Email</label>

    <input
      id="adminEmail"
      type="email"
      placeholder="Admin email"
    >

    <label>Password</label>

    <input
      id="adminPassword"
      type="password"
      placeholder="Password"
    >

    <button
      class="primary"
      style="width:100%"
      onclick="adminLogin()"
    >
      Login
    </button>

    <div id="loginError"></div>

  </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboard" class="hidden">

<header>

  <h1>💜 Elyvion Admin Panel</h1>

  <p id="adminEmailText"></p>

  <button
    class="danger"
    style="margin-top:12px"
    onclick="adminLogout()"

</header>


<div class="container">

  <!-- ================= STATS ================= -->

  <div class="stats">

      <b id="totalUsers">0</b>
    </div>

    <div class="stat">
      <small>Deposit Requests</small>
      <b id="totalDeposits">0</b>
    </div>

    </div>

    <div class="stat">
      <small>Withdrawal Requests</small>

}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyDW2cneWncBkDz_iVeUtKpjgl-NRxh0qQA",

  authDomain:
  "elyvioncom.firebaseapp.com",

  projectId:
  "elyvioncom",

  storageBucket:
  "elyvioncom.firebasestorage.app",

  messagingSenderId:
  "696113174945",

  appId:
  "1:696113174945:web:7dd53b1d9e47d6d05613e0",

  measurementId:
  "G-059RB98EPD"

};


/* =========================
   INITIALIZE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   ADMIN
========================= */

const ADMIN_EMAIL =
  "saikatmd7373@gmail.com";


/* =========================
   GLOBAL USER DATA
========================= */

let allUsers = [];


/* =========================
   WINDOW FUNCTIONS
========================= */

window.adminLogin = adminLogin;
window.adminLogout = adminLogout;
window.loadAll = loadAll;
window.filterUsers = filterUsers;


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth,user=>{

  if(!user){

    document
      .getElementById("loginPage")
      .classList.remove("hidden");

    document
      .getElementById("dashboard")
      .classList.add("hidden");

    return;
  }


  if(user.email !== ADMIN_EMAIL){

    alert("এই account-এর Admin access নেই।");

    signOut(auth);

    return;
  }


  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  document
    .getElementById("adminEmailText")
    .innerText =
    user.email || "";

  loadAll();

});


/* =========================
   LOGIN
========================= */

async function adminLogin(){

  const email =
    document
      .getElementById("adminEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;

  const error =
    document
      .getElementById("loginError");


  error.className="";
  error.innerText="";


  if(!email || !password){

    error.className="error";

    error.innerText=
      "Email এবং password দিন।";

    return;
  }


  if(email !== ADMIN_EMAIL){

    error.className="error";

    error.innerText=
      "এই email Admin account নয়।";

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }

  catch(e){

    console.error(e);

    error.className="error";

    error.innerText=
      "Login failed: "+e.code;

  }

}


/* =========================
   LOGOUT
========================= */

async function adminLogout(){

  await signOut(auth);

}


/* =========================
   LOAD ALL
========================= */

function loadAll(){

  loadUsers();
  loadDeposits();
  loadPlans();
  loadWithdrawals();
  loadTasks();
  loadTickets();

}


/* =========================
   USERS
========================= */

function loadUsers(){

  const q =
    query(
      collection(db,"users")
    );


  onSnapshot(q,snap=>{

    allUsers =
      snap.docs.map(doc=>({

        id:doc.id,
        ...doc.data()

      }));


    /* TOTAL USER */

    document
      .getElementById("totalUsers")
      .innerText =
      allUsers.length;


    renderUsers(allUsers);

  },error=>{

    console.error("Users error:",error);

    document
      .getElementById("totalUsers")
      .innerText="0";

    document
      .getElementById("userList")
      .innerHTML=
      `
      <div class="empty">
        Users data load করা যায়নি।<br><br>
        Firestore Rules এবং users collection check করুন।
      </div>
      `;

  });

}


/* =========================
   RENDER USERS
========================= */

function renderUsers(users){

  const box =
    document.getElementById("userList");


  if(!users.length){

    box.innerHTML=
      `
      <div class="empty">
        কোনো User পাওয়া যায়নি।
      </div>
      `;

    return;
  }


  box.innerHTML =
    users.map(x=>{

      return `

      <div class="user-card">

        <div class="user-name">
          👤 ${escapeHTML(
            x.name ||
            x.fullName ||
            x.username ||
            "User"
          )}
        </div>

        <div class="row">
          <span>Email</span>
          <b>
            ${escapeHTML(x.email || "")}
          </b>
        </div>

        <div class="row">
          <span>UID</span>
          <b>
            ${escapeHTML(x.uid || x.id || "")}
          </b>
        </div>

        <div class="row">
          <span>Plan</span>
          <b>
            ${escapeHTML(
              x.plan ||
              x.planName ||
              "No Plan"
            )}
          </b>
        </div>

        <div class="row">
          <span>Balance</span>
          <b>
            ৳${Number(
              x.balance ||
              x.wallet ||
              0
            ).toLocaleString()}
          </b>
        </div>

      </div>

      `;

    }).join("");

}


/* =========================
   SEARCH USERS
========================= */

function filterUsers(){

  const value =
    document
      .getElementById("userSearch")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    allUsers.filter(x=>{

      const text =
        (
          (x.name || "") +
          " " +
          (x.email || "") +
          " " +
          (x.username || "") +
          " " +
          (x.uid || "") +
          " " +
          (x.id || "")
        ).toLowerCase();

      return text.includes(value);

    });


  renderUsers(filtered);

}


/* =========================
   DEPOSITS
========================= */

function loadDeposits(){

  const q =
    query(
      collection(db,"depositRequests")
    );


  onSnapshot(q,snap=>{

    document
      .getElementById("totalDeposits")
      .innerText =
      snap.size;


    const box =
      document
        .getElementById("depositList");


    if(snap.empty){

      box.innerHTML=
        '<div class="empty">কোনো Deposit Request নেই</div>';

      return;
    }


    const docs =
      sortByCreatedAt(snap.docs);


    box.innerHTML =
      docs.map(d=>{

        const x=d.data();

        const status=
          x.status || "Pending";


        return `

        <div class="request">

          <div class="row">
            <span>User</span>
            <b>
              ${escapeHTML(
                x.email ||
                x.uid ||
                ""
              )}
            </b>
          </div>

          <div class="row">
            <span>Amount</span>
            <b>
              ৳${Number(
                x.amount || 0
              ).toLocaleString()}
            </b>
          </div>

          <div class="row">
            <span>Method</span>
            <b>
              ${escapeHTML(
                x.method || ""
              )}
            </b>
          </div>

          <div class="row">
            <span>Sender Last 4</span>
            <b>
              ${escapeHTML(
                x.senderLast4 || ""
              )}
            </b>
          </div>

          <div class="row">
            <span>Status</span>
            <span class="status">
              ${escapeHTML(status)}
            </span>
          </div>

          ${
            x.screenshotURL
            ?
            `
            <img
              class="screenshot"
              src="${escapeHTML(
                x.screenshotURL
              )}"
              onclick="window.open(
                '${escapeHTML(x.screenshotURL)}',
                '_blank'
              )"
              alt="Screenshot"
            >
            `
            :
            ""
          }

        </div>

        `;

      }).join("");

  },error=>{

    console.error("Deposit error:",error);

    document
      .getElementById("depositList")
      .innerHTML=
      `
      <div class="empty">
        Deposit data load করা যায়নি।
      </div>
      `;

  });

}

  },error=>{

    console.error(
      "Support error:",
      error
    );

  });

}


/* =========================
   SORT CREATED AT
========================= */

function sortByCreatedAt(docs){

  return [...docs].sort((a,b)=>{

    const ad=a.data();
    const bd=b.data();

    const at=
      getTime(ad.createdAt);

    const bt=
      getTime(bd.createdAt);

    return bt-at;

  });

}


function getTime(value){

  if(!value)
    return 0;

  if(
    typeof value.toMillis ===
    "function"
  ){
    return value.toMillis();
  }

  if(
    value.seconds
  ){
    return value.seconds*1000;
  }

  const date=
    new Date(value);

  const time=
    date.getTime();

  return isNaN(time)
    ? 0
    : time;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
