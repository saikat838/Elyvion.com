<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Elyvion — Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f2ff;
  color:#211437;
}

.hidden{
  display:none!important;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#6d28d9;
  color:white;
}

.success{
  background:#dcfce7;
  color:#15803d;
}

.reject{
  background:#fee2e2;
  color:#b91c1c;
}

.secondary{
  background:#ede9fe;
  color:#5b21b6;
}

header{
  background:linear-gradient(135deg,#5b21b6,#8b5cf6);
  color:white;
  padding:18px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.header-email{
  font-size:12px;
  opacity:.85;
  margin-top:4px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(91,33,182,.08);
}

.stat small{
  color:#777;
}

.stat b{
  display:block;
  font-size:25px;
  color:#5b21b6;
  margin-top:7px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:18px;
}

.tabs button{
  white-space:nowrap;
  background:white;
  color:#666;
}

.tabs button.active{
  background:#6d28d9;
  color:white;
}

.panel{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 15px rgba(91,33,182,.08);
  margin-bottom:18px;
}

.panel-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.request{
  border:1px solid #eee;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
}

.request-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.request-info{
  line-height:1.7;
  font-size:14px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  background:#fff7ed;
  color:#b45309;
}

.status.approved{
  background:#dcfce7;
  color:#15803d;
}

.status.rejected{
  background:#fee2e2;
  color:#b91c1c;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  flex:1;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:11px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:13px;
}

th{
  color:#5b21b6;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0 12px;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.1);
}

.login-logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  color:#5b21b6;
  margin-bottom:5px;
}

.login-sub{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-bottom:20px;
}

.error{
  background:#fee2e2;
  color:#b91c1c;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
  font-size:13px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }

  table{
    display:block;
    overflow-x:auto;
  }

  .actions{
    flex-direction:column;
  }
}
</style>
</head>

/*
==================================================
AUTH
==================================================
*/

window.adminLogin = adminLogin;
window.adminLogout = adminLogout;
window.showSection = showSection;
window.updateRequest = updateRequest;


async function adminLogin(){

  const email =
    document
      .getElementById("adminEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;

  const errorBox =
    document.getElementById("loginError");


  errorBox.classList.add("hidden");


  if(!email || !password){

    errorBox.innerText =
      "Email এবং Password দিন।";

    errorBox.classList.remove("hidden");

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }

  catch(error){

    console.error(error);

    errorBox.innerText =
      "Login failed: " + error.message;

    errorBox.classList.remove("hidden");

  }

}


async function adminLogout(){

  await signOut(auth);

}


onAuthStateChanged(
  auth,
  user => {

    if(user){

      document
        .getElementById("loginPage")
        .classList.add("hidden");

      document
        .getElementById("adminPage")
        .classList.remove("hidden");

      document
        .getElementById("adminEmailText")
        .innerText =
        user.email || "";

      loadAll();

    }
    else{

      document
        .getElementById("loginPage")
        .classList.remove("hidden");

      document
        .getElementById("adminPage")
        .classList.add("hidden");

    }

  }
);


/*
==================================================
SECTION
==================================================
*/

function showSection(name,btn){

  const sections = [
    "users",
    "deposits",
    "withdrawals",
    "tasks",
    "plans",
    "tickets"
  ];


  sections.forEach(
    x => {

      document
        .getElementById(
          x + "Section"
        )
        .classList.add("hidden");

    }
  );


  document
    .getElementById(
      name + "Section"
    )
    .classList.remove("hidden");


  document
    .querySelectorAll(".tabs button")
    .forEach(
      b =>
      b.classList.remove("active")
    );


  btn.classList.add("active");

}


/*
==================================================
FORMAT
==================================================
*/

function money(value){

  return Number(
    value || 0
  ).toLocaleString("en-US");

}


function dateText(timestamp){

  if(!timestamp){
    return "—";
  }

  try{

    return timestamp
      .toDate()
      .toLocaleString("bn-BD");

  }

  catch{

    return "—";

  }

}


/*
==================================================
LOAD ALL
==================================================
*/

function loadAll(){

  loadUsers();
  loadDeposits();
  loadWithdrawals();
  loadTasks();
  loadPlans();
  loadTickets();

}


/*
==================================================
USERS
==================================================
*/

function loadUsers(){

  const q =
    query(
      collection(db,"users"),
      orderBy("createdAt","desc")
    );


  onSnapshot(
    q,
    snapshot => {

      document
        .getElementById("totalUsers")
        .innerText =
        snapshot.size;


      const box =
        document.getElementById("usersBox");


      if(snapshot.empty){

        box.innerHTML =
          `<div class="empty">
             কোনো user নেই
           </div>`;

        return;

      }


      let html = `
        <table>

          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Balance</th>
              <th>Plan</th>
            </tr>
          </thead>

          <tbody>
      `;


      snapshot.forEach(
        snap => {

          const x =
            snap.data();


          html += `

            <tr>

              <td>
                ${escapeHTML(x.name || "User")}
              </td>

              <td>
                ${escapeHTML(x.email || "")}
              </td>

              <td>
                ৳${money(x.balance)}
              </td>

              <td>
                ${
                  x.activePlan
                  ? escapeHTML(x.activePlan.rank || "")
                  : "None"
                }
              </td>

            </tr>

          `;

        }
      );


      html += `
          </tbody>
        </table>
      `;


      box.innerHTML = html;

    },

    error => {

      console.error(error);

      document
        .getElementById("usersBox")
        .innerHTML =
        `<div class="empty">
          Users load করা যায়নি।
        </div>`;

    }
  );

}


/*
==================================================
DEPOSITS
==================================================
*/

function loadDeposits(){

  const q =
    query(
      collection(db,"depositRequests"),
      orderBy("createdAt","desc")
    );


  onSnapshot(
    q,
    snapshot => {

      document
        .getElementById("totalDeposits")
        .innerText =
        snapshot.size;


      const box =
        document.getElementById("depositsBox");


      if(snapshot.empty){

        box.innerHTML =
          `<div class="empty">
             কোনো deposit request নেই।
           </div>`;

        return;

      }


      box.innerHTML =
        snapshot.docs.map(
          snap => {

            const x =
              snap.data();


            return requestCard(

              snap.id,

              "Deposit",

              `
              <b>Amount:</b>
              ৳${money(x.amount)}
              <br>

              <b>Method:</b>
              ${escapeHTML(x.method || "")}
              <br>

              <b>Payment Number:</b>
              ${escapeHTML(x.paymentNumber || "")}
              <br>

              <b>Sender Last 4:</b>
              ${escapeHTML(x.senderLast4 || "")}
              <br>

              <b>Email:</b>
              ${escapeHTML(x.email || "")}
              <br>

              <small>
                ${dateText(x.createdAt)}
              </small>
              `,

              x.status

            );

          }
        ).join("");

    }
  );

}

/*
==================================================
REQUEST CARD
==================================================
*/

function requestCard(
  id,
  type,
  content,
  status
){

  const safeStatus =
    String(status || "Pending");


  let actions = "";


  if(
    safeStatus === "Pending" ||
    safeStatus === "Open"
  ){

    actions = `

      <div class="actions">

        <button
          class="success"
          onclick="updateRequest(
            '${id}',
            '${type}',
            'Approved'
          )">

          ✓ Approve

        </button>

        <button
          class="reject"
          onclick="updateRequest(
            '${id}',
            '${type}',
            'Rejected'
          )">

          ✕ Reject

        </button>

      </div>

    `;

  }


  const statusClass =
    safeStatus === "Approved"
      ? "approved"
      : safeStatus === "Rejected"
        ? "rejected"
        : "";


  return `

    <div class="request">

      <div class="request-top">

        <div class="request-info">

          ${content}

        </div>

        <span class="status ${statusClass}">

          ${escapeHTML(safeStatus)}

        </span>

      </div>

      ${actions}

    </div>

  `;

}


/*
==================================================
UPDATE REQUEST
==================================================
*/

async function updateRequest(
  id,
  type,
  newStatus
){

  if(!confirm(
    `${type} request ${newStatus} করতে চান?`
  )){
    return;
  }


  let collectionName = "";


  if(type === "Deposit"){
    collectionName =
      "depositRequests";
  }

  else if(type === "Withdrawal"){
    collectionName =
      "withdrawalRequests";
  }

  else if(type === "Task"){
    collectionName =
      "taskCompletions";
  }

  else if(type === "Plan"){
    collectionName =
      "planRequests";
  }

  else if(type === "Support"){
    collectionName =
      "supportTickets";
  }


  if(!collectionName){
    return;
  }


  try{

    await updateDoc(

      doc(
        db,
        collectionName,
        id
      ),

      {
        status:newStatus,
        reviewedAt:
          serverTimestamp()
      }

    );


    alert(
      `${type} ${newStatus} হয়েছে।`
    );

  }

  catch(error){

    console.error(error);

    alert(
      "Update হয়নি: " +
      error.message
    );

  }

}


/*
==================================================
SECURITY HELPER
==================================================
*/

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>
