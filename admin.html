<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Elyvion — Admin Panel</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f6f2ff;
  color:#211437;
  padding-bottom:40px;
}

.hidden{
  display:none!important;
}

header{
  background:linear-gradient(135deg,#5b21b6,#8b5cf6);
  color:white;
  padding:20px;
}

header h1{
  font-size:24px;
}

header p{
  margin-top:6px;
  font-size:13px;
  opacity:.85;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 5px 20px rgba(91,33,182,.08);
}

.login{
  max-width:420px;
  margin:70px auto;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0 12px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#7c3aed;
}

label{
  font-size:13px;
  font-weight:bold;
  color:#555;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#6d28d9;
  color:white;
}

.success{
  background:#dcfce7;
  color:#15803d;
}

.reject{
  background:#fee2e2;
  color:#b91c1c;
}

.gray{
  background:#eee;
  color:#444;
}

.blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.error{
  color:#b91c1c;
  background:#fee2e2;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:13px;
}

.success-msg{
  color:#15803d;
  background:#dcfce7;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(91,33,182,.08);
}

.stat small{
  color:#777;
}

.stat b{
  display:block;
  color:#5b21b6;
  font-size:25px;
  margin-top:8px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
  margin:25px 0 12px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.toolbar input,
.toolbar select{
  flex:1;
  min-width:180px;
  margin:0;
}

.request{
  border:1px solid #eadfff;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.row:last-child{
  border-bottom:0;
}

.row b{
  color:#5b21b6;
  text-align:right;
  word-break:break-word;
}

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  background:#fff7ed;
  color:#b45309;
}

.status.approved{
  background:#dcfce7;
  color:#15803d;
}

.status.rejected{
  background:#fee2e2;
  color:#b91c1c;
}

.status.completed{
  background:#dbeafe;
  color:#1d4ed8;
}

.status.closed{
  background:#e5e7eb;
  color:#374151;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.screenshot{
  width:220px;
  max-height:220px;
  object-fit:contain;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:12px;
  cursor:pointer;
  background:#fafafa;
}

.empty{
  text-align:center;
  color:#777;
  padding:25px;
}

.user-card{
  border:1px solid #eadfff;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.modal-box{
  background:white;
  max-width:500px;
  width:100%;
  border-radius:16px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modal img{
  width:100%;
  max-height:70vh;
  object-fit:contain;
}

.top-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr;
  }

  .row{
    flex-direction:column;
  }

  .row b{
    text-align:left;
  }

  header h1{
    font-size:20px;
  }

}

</style>
</head>

<body>


<!-- =====================================================
LOGIN
===================================================== -->

<div id="loginPage">

  <div class="card login">

    <h2 style="text-align:center;color:#5b21b6">
      💜 Elyvion Admin
    </h2>

    <p style="text-align:center;color:#777;margin:8px 0 20px">
      Admin Login
    </p>

    <label>Email</label>

    <input
      id="adminEmail"
      type="email"
      placeholder="Admin email"
    >

    <label>Password</label>

    <input
      id="adminPassword"
      type="password"
      placeholder="Password"
    >

    <button
      class="primary"
      style="width:100%"
      onclick="adminLogin()"
    >
      Login
    </button>

    <div id="loginError"></div>

  </div>

</div>


<!-- =====================================================
DASHBOARD
===================================================== -->

<div id="dashboard" class="hidden">

<header>

  <h1>💜 Elyvion Admin Panel</h1>

  <p id="adminEmailText"></p>

  <div class="top-actions">

    <button
      class="gray"
      onclick="loadAll()"
    >
      🔄 Refresh
    </button>

    <button
      class="danger"
      onclick="adminLogout()"
    >
      Logout
    </button>

  </div>

</header>


<div class="container">


<!-- =====================================================
STATS
===================================================== -->

<div class="stats">

  <div class="stat">
    <small>Total Users</small>
    <b id="totalUsers">0</b>
  </div>

  <div class="stat">
    <small>Deposit Requests</small>
    <b id="totalDeposits">0</b>
  </div>

  <div class="stat">
    <small>Plan Requests</small>
    <b id="totalPlans">0</b>
  </div>

  <div class="stat">
    <small>Withdrawal Requests</small>
    <b id="totalWithdraws">0</b>
  </div>

</div>


<!-- =====================================================
USERS
===================================================== -->

<div class="section-title">
👥 Users
</div>

<div class="card">

  <div class="toolbar">

    <input
      id="userSearch"
      placeholder="Search name, email or UID..."
      oninput="filterUsers()"
    >

  </div>

  <div id="userList">
    <div class="empty">Loading...</div>
  </div>

</div>


<!-- =====================================================
DEPOSITS
===================================================== -->

<div class="section-title">
📥 Deposit Requests
</div>

<div class="card">

  <div class="toolbar">

    <select
      id="depositFilter"
      onchange="filterSection('deposit')"
    >

      <option value="all">All</option>
      <option value="Pending">Pending</option>
      <option value="Approved">Approved</option>
      <option value="Rejected">Rejected</option>

    </select>

  </div>

  <div id="depositList">
    <div class="empty">Loading...</div>
  </div>

</div>


<!-- =====================================================
PLANS
===================================================== -->

<div class="section-title">
📦 Plan Requests
</div>

<div class="card">

  <div class="toolbar">

    <select
      id="planFilter"
      onchange="filterSection('plan')"
    >

      <option value="all">All</option>
      <option value="Pending">Pending</option>
      <option value="Approved">Approved</option>
      <option value="Rejected">Rejected</option>

    </select>

  </div>

  <div id="planList">
    <div class="empty">Loading...</div>
  </div>

</div>


<!-- =====================================================
WITHDRAWALS
===================================================== -->

<div class="section-title">
💸 Withdrawal Requests
</div>

<div class="card">

  <div class="toolbar">

    <select
      id="withdrawFilter"
      onchange="filterSection('withdraw')"
    >

      <option value="all">All</option>
      <option value="Pending">Pending</option>
      <option value="Processing">Processing</option>
      <option value="Completed">Completed</option>
      <option value="Rejected">Rejected</option>

    </select>

  </div>

  <div id="withdrawList">
    <div class="empty">Loading...</div>
  </div>

</div>


<!-- =====================================================
TASKS
===================================================== -->

<div class="section-title">
✅ Task Verification
</div>

<div class="card">

  <div class="toolbar">

    <select
      id="taskFilter"
      onchange="filterSection('task')"
    >

      <option value="all">All</option>
      <option value="Pending">Pending</option>
      <option value="Approved">Approved</option>
      <option value="Rejected">Rejected</option>

    </select>

  </div>

  <div id="taskList">
    <div class="empty">Loading...</div>
  </div>

</div>


<!-- =====================================================
SUPPORT
===================================================== -->

<div class="section-title">
🎧 Support Tickets
</div>

<div class="card">

  <div id="ticketList">
    <div class="empty">Loading...</div>
  </div>

</div>


</div>
</div>


<!-- =====================================================
MODAL
===================================================== -->

<div
  id="modal"
  class="modal hidden"
  onclick="closeModal()"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >

    <div id="modalContent"></div>

    <button
      class="gray"
      style="width:100%;margin-top:15px"
      onclick="closeModal()"
    >
      Close
    </button>

  </div>

</div>


<!-- =====================================================
FIREBASE
===================================================== -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyDW2cneWncBkDz_iVeUtKpjgl-NRxh0qQA",

  authDomain:
  "elyvioncom.firebaseapp.com",

  projectId:
  "elyvioncom",

  storageBucket:
  "elyvioncom.firebasestorage.app",

  messagingSenderId:
  "696113174945",

  appId:
  "1:696113174945:web:7dd53b1d9e47d6d05613e0",

  measurementId:
  "G-059RB98EPD"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =====================================================
ADMIN EMAIL
===================================================== */

const ADMIN_EMAIL =
  "saikatmd7373@gmail.com";


/* =====================================================
GLOBAL DATA
===================================================== */

let usersData = [];
let depositsData = [];
let plansData = [];
let withdrawsData = [];
let tasksData = [];
let ticketsData = [];


/* =====================================================
WINDOW FUNCTIONS
===================================================== */

window.adminLogin = adminLogin;
window.adminLogout = adminLogout;
window.loadAll = loadAll;

window.filterUsers = filterUsers;
window.filterSection = filterSection;

window.approveDeposit = approveDeposit;
window.rejectDeposit = rejectDeposit;

window.approvePlan = approvePlan;
window.rejectPlan = rejectPlan;

window.processWithdrawal = processWithdrawal;
window.completeWithdrawal = completeWithdrawal;
window.rejectWithdrawal = rejectWithdrawal;

window.approveTask = approveTask;
window.rejectTask = rejectTask;

window.closeTicket = closeTicket;
window.deleteRequest = deleteRequest;

window.showImage = showImage;
window.closeModal = closeModal;


/* =====================================================
AUTH STATE
===================================================== */

onAuthStateChanged(auth,user=>{

  if(!user){

    document
      .getElementById("loginPage")
      .classList.remove("hidden");

    document
      .getElementById("dashboard")
      .classList.add("hidden");

    return;

  }


  if(user.email !== ADMIN_EMAIL){

    alert("এই account-এর Admin access নেই।");

    signOut(auth);

    return;

  }


  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  document
    .getElementById("adminEmailText")
    .innerText =
    user.email || "";

  loadAll();

});


/* =====================================================
LOGIN
===================================================== */

async function adminLogin(){

  const email =
    document
      .getElementById("adminEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;

  const error =
    document
      .getElementById("loginError");


  error.className = "";
  error.innerText = "";


  if(!email || !password){

    error.className = "error";

    error.innerText =
      "Email এবং password দিন।";

    return;

  }


  if(email !== ADMIN_EMAIL){

    error.className = "error";

    error.innerText =
      "এই email Admin account নয়।";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }
  catch(e){

    console.error(e);

    error.className = "error";

    error.innerText =
      "Login failed: " + e.code;

  }

}


/* =====================================================
LOGOUT
===================================================== */

async function adminLogout(){

  await signOut(auth);

}


/* =====================================================
LOAD ALL
===================================================== */

function loadAll(){

  loadUsers();
  loadDeposits();
  loadPlans();
  loadWithdrawals();
  loadTasks();
  loadTickets();

}


/* =====================================================
USERS
===================================================== */

function loadUsers(){

  const q =
    query(
      collection(db,"users")
    );


  onSnapshot(q,snap=>{

    usersData =
      snap.docs.map(d=>({

        id:d.id,
        ...d.data()

      }));


    document
      .getElementById("totalUsers")
      .innerText =
      usersData.length;


    renderUsers();

  },error=>{

    console.error("Users:",error);

    document
      .getElementById("userList")
      .innerHTML =
      '<div class="empty">Users load করা যায়নি।</div>';

  });

}


function renderUsers(){

  const search =
    document
      .getElementById("userSearch")
      .value
      .toLowerCase()
      .trim();


  const list =
    usersData.filter(x=>{

      const text =
        (
          x.name || "" +
          " " +
          x.email || "" +
          " " +
          x.uid || ""
        ).toLowerCase();

      return text.includes(search);

    });


  const box =
    document
      .getElementById("userList");


  if(!list.length){

    box.innerHTML =
      '<div class="empty">কোনো User পাওয়া যায়নি।</div>';

    return;

  }


  box.innerHTML =
    list.map(x=>`

      <div class="user-card">

        <div class="row">
          <span>Name</span>
          <b>${escapeHTML(x.name || "—")}</b>
        </div>

        <div class="row">
          <span>Email</span>
          <b>${escapeHTML(x.email || "—")}</b>
        </div>

        <div class="row">
          <span>UID</span>
          <b>${escapeHTML(x.uid || x.id || "—")}</b>
        </div>

        <div class="row">
          <span>Plan</span>
          <b>${escapeHTML(x.plan || "—")}</b>
        </div>

        <div class="row">
          <span>Status</span>
          <b>${escapeHTML(x.status || "Active")}</b>
        </div>

      </div>

    `).join("");

}


function filterUsers(){

  renderUsers();

}


/* =====================================================
DEPOSITS
===================================================== */

function loadDeposits(){

  const q =
    query(
      collection(db,"depositRequests"),
      orderBy("createdAt","desc")
    );


  onSnapshot(q,snap=>{

    depositsData =
      snap.docs.map(d=>({

        id:d.id,
        ...d.data()

      }));


    document
      .getElementById("totalDeposits")
      .innerText =
      depositsData.length;


    renderDeposits();

  },error=>{

    console.error(error);

    document
      .getElementById("depositList")
      .innerHTML =
      '<div class="empty">Deposit data load করা যায়নি।</div>';

  });

}


function renderDeposits(){

  const filter =
    document
      .getElementById("depositFilter")
      .value;


  const list =
    depositsData.filter(x=>
      filter === "all" ||
      (x.status || "Pending") === filter
    );


  const box =
    document
      .getElementById("depositList");


  if(!list.length){

    box.innerHTML =
      '<div class="empty">কোনো Deposit Request নেই।</div>';

    return;

  }


  box.innerHTML =
    list.map(x=>{

      const status =
        x.status || "Pending";


      return `

      <div class="request">

        <div class="row">
          <span>User</span>
          <b>${escapeHTML(x.email || x.uid || "")}</b>
        </div>

        <div class="row">
          <span>Amount</span>
          <b>৳${Number(x.amount || 0).toLocaleString()}</b>
        </div>

        <div class="row">
          <span>Method</span>
          <b>${escapeHTML(x.method || "")}</b>
        </div>

        <div class="row">
          <span>Sender Last 4</span>
          <b>${escapeHTML(x.senderLast4 || "")}</b>
        </div>

        <div class="row">
          <span>Status</span>
          <span class="status ${statusClass(status)}">
            ${escapeHTML(status)}
          </span>
        </div>

        ${
          x.screenshotURL
          ?
          `
          <img
            class="screenshot"
            src="${escapeHTML(x.screenshotURL)}"
            onclick="showImage('${escapeHTML(x.screenshotURL)}')"
            alt="Deposit Screenshot"
          >
          `
          :
          ""
        }

        ${
          status === "Pending"
          ?
          `
          <div class="actions">

            <button
              class="success"
              onclick="approveDeposit('${x.id}')"
            >
              ✓ Approve
            </button>

            <button
              class="reject"
              onclick="rejectDeposit('${x.id}')"
            >
              ✕ Reject
            </button>

          </div>
          `
          :
          ""
        }

        <div class="actions">

          <button
            class="danger"
            onclick="deleteRequest('depositRequests','${x.id}')"
          >
            🗑 Delete
          </button>

        </div>

      </div>

      `;

    }).join("");

}


async function approveDeposit(id){

  await changeStatus(
    "depositRequests",
    id,
    "Approved"
  );

}


async function rejectDeposit(id){

  await changeStatus(
    "depositRequests",
    id,
    "Rejected"
  );

}


/* =====================================================
PLANS
===================================================== */

function loadPlans(){

  const q =
    query(
      collection(db,"planRequests"),
      orderBy("createdAt","desc")
    );


  onSnapshot(q,snap=>{

    plansData =
      snap.docs.map(d=>({

        id:d.id,
        ...d.data()

      }));


    document
      .getElementById("totalPlans")
      .innerText =
      plansData.length;


    renderPlans();

  },error=>{

    console.error(error);

  });

}


function renderPlans(){

  const filter =
    document
      .getElementById("planFilter")
      .value;


  const list =
    plansData.filter(x=>
      filter === "all" ||
      (x.status || "Pending") === filter
    );


  const box =
    document
      .getElementById("planList");


  if(!list.length){

    box.innerHTML =
      '<div class="empty">কোনো Plan Request নেই।</div>';

    return;

  }


  box.innerHTML =
    list.map(x=>{

      const p =
        x.plan || {};

      const status =
        x.status || "Pending";


      return `

      <div class="request">

        <div class="row">
          <span>User</span>
          <b>${escapeHTML(x.email || x.uid || "")}</b>
        </div>

        <div class="row">
          <span>Plan</span>
          <b>${escapeHTML(p.rank || "")}</b>
        </div>

        <div class="row">
          <span>Price</span>
          <b>৳${Number(p.price || 0).toLocaleString()}</b>
        </div>

        <div class="row">
          <span>Daily Reward</span>
          <b>৳${Number(p.daily || 0).toLocaleString()}</b>
        </div>

        <div class="row">
          <span>Status</span>

          <span class="status ${statusClass(status)}">
            ${escapeHTML(status)}
          </span>

        </div>

        ${
          status === "Pending"
          ?
          `
          <div class="actions">

            <button
              class="success"
              onclick="approvePlan('${x.id}')"
            >
              ✓ Approve
            </button>

            <button
              class="reject"
              onclick="rejectPlan('${x.id}')"
            >
              ✕ Reject
            </button>

          </div>
          `
          :
          ""
        }

        <div class="actions">

          <button
            class="danger"
            onclick="deleteRequest('planRequests','${x.id}')"
          >
            🗑 Delete
          </button>

        </div>

      </div>

      `;

    }).join("");

}


async function approvePlan(id){

  await changeStatus(
    "planRequests",
    id,
    "Approved"
  );

}


async function rejectPlan(id){

  await changeStatus(
    "planRequests",
    id,
    "Rejected"
  );

}


/* =====================================================
WITHDRAWALS
===================================================== */

function loadWithdrawals(){

  const q =
    query(
      collection(db,"withdrawalRequests"),
      orderBy("createdAt","desc")
    );


  onSnapshot(q,snap=>{

    withdrawsData =
      snap.docs.map(d=>({

        id:d.id,
        ...d.data()

      }));


    document
      .getElementById("totalWithdraws")
      .innerText =
      withdrawsData.length;


    renderWithdrawals();

  },error=>{

    console.error(error);

  });

}


function renderWithdrawals(){

  const filter =
    document
      .getElementById("withdrawFilter")
      .value;


  const list =
    withdrawsData.filter(x=>
      filter === "all" ||
      (x.status || "Pending") === filter
    );


  const box =
    document
      .getElementById("withdrawList");


  if(!list.length){

    box.innerHTML =
      '<div class="empty">কোনো Withdrawal Request নেই।</div>';

    return;

  }


  box.innerHTML =
    list.map(x=>{

      const status =
        x.status || "Pending";


      return `

      <div class="request">

        <div class="row">
          <span>User</span>
          <b>${escapeHTML(x.email || x.uid || "")}</b>
        </div>

        <div class="row">
          <span>Amount</span>
          <b>৳${Number(x.amount || 0).toLocaleString()}</b>
        </div>

        <div class="row">
          <span>Method</span>
          <b>${escapeHTML(x.method || "")}</b>
        </div>

        <div class="row">
          <span>Account</span>
          <b>${escapeHTML(x.number || "")}</b>
        </div>

        <div class="row">
          <span>Name</span>
          <b>${escapeHTML(x.name || "")}</b>
        </div>

        <div class="row">
          <span>Status</span>

          <span class="status ${statusClass(status)}">
            ${escapeHTML(status)}
          </span>

        </div>


        <div class="actions">

          ${
            status === "Pending"
            ?
            `
            <button
              class="blue"
              onclick="processWithdrawal('${x.id}')"
            >
              ⚙ Processing
            </button>

            <button
              class="reject"
              onclick="rejectWithdrawal('${x.id}')"
            >
              ✕ Reject
            </button>
            `
            :
            ""
          }


          ${
            status === "Processing"
            ?
            `
            <button
              class="success"
              onclick="completeWithdrawal('${x.id}')"
            >
              ✓ Mark Completed
            </button>
            `
            :
            ""
          }

        </div>


        <div class="actions">

          <button
            class="danger"
            onclick="deleteRequest('withdrawalRequests','${x.id}')"
          >
            🗑 Delete
          </button>

        </div>

      </div>

      `;

    }).join("");

}


async function processWithdrawal(id){

  await changeStatus(
    "withdrawalRequests",
    id,
    "Processing"
  );

}


async function completeWithdrawal(id){

  await changeStatus(
    "withdrawalRequests",
    id,
    "Completed"
  );

}


async function rejectWithdrawal(id){

  await changeStatus(
    "withdrawalRequests",
    id,
    "Rejected"
  );

}

/* =====================================================
CHANGE STATUS
===================================================== */

async function changeStatus(
  collectionName,
  id,
  status
){

  const confirmed =
    confirm(
      "আপনি কি নিশ্চিতভাবে status পরিবর্তন করতে চান?"
    );


  if(!confirmed)
    return;


  try{

    await updateDoc(
      doc(db,collectionName,id),
      {
        status:status,
        reviewedBy:ADMIN_EMAIL,
        reviewedAt:serverTimestamp()
      }
    );


    alert(
      "Status successfully updated: " +
      status
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Update করা যায়নি। Firestore Rules check করুন।"
    );

  }

}


/* =====================================================
DELETE
===================================================== */

async function deleteRequest(
  collectionName,
  id
){

  const confirmed =
    confirm(
      "এই request permanently delete করতে চান?"
    );


  if(!confirmed)
    return;


  try{

    await deleteDoc(
      doc(db,collectionName,id)
    );


    alert("Deleted successfully.");

  }
  catch(error){

    console.error(error);

    alert(
      "Delete করা যায়নি। Firestore Rules check করুন।"
    );

  }

}

/* =====================================================
HELPERS
===================================================== */

function statusClass(status){

  const s =
    String(status || "")
      .toLowerCase();

  if(s === "approved")
    return "approved";

  if(s === "rejected")
    return "rejected";

  if(s === "completed")
    return "completed";

  if(s === "closed")
    return "closed";

  return "";

}


function escapeHTML(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
